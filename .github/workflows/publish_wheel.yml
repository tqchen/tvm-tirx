name: Build Windows ARM64 validation artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, branch, or SHA to build"
        required: true
        type: string
      publish_repository:
        description: "Where to publish after the wheel build succeeds"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - pypi

permissions:
  contents: read

# CI runners are ephemeral, so pip's HTTP cache buys nothing and a stale
# preinstalled cache (e.g. on the macOS image) only produces noisy
# "Cache entry deserialization failed" warnings. Disable it everywhere.
env:
  PIP_NO_CACHE_DIR: "1"

jobs:
  build_wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CIBW_TEST_SKIP: "*"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows ARM64 wheel with CUDA runtime"
            os: windows-11-arm
            arch: ARM64
            build: cp312-win_arm64
            include_cuda_runtime: "1"
            artifact_suffix: windows-arm64
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          # Preserve the source history and tags for reproducible release builds.
          fetch-depth: 0
          fetch-tags: true

      # Land the sidecar where -DTVM_TIRX_PACKAGE_EXTRA_LIBS / cibuildwheel's /project
      # mount expects it. Skipped on CPU-only rows (macOS).
      - name: Download CUDA runtime sidecar
        if: ${{ matrix.include_cuda_runtime == '1' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: tirx-cuda-runtime-${{ matrix.arch }}
          path: build-wheel-cuda/lib
          run-id: 40253584181
          github-token: ${{ github.token }}

      - name: Build and test native and LLVM targets wheels
        uses: ./.github/actions/build-wheel-for-publish
        with:
          arch: ${{ matrix.arch }}
          build: ${{ matrix.build }}
          cmake_defines: ${{ matrix.cmake_defines }}
          include_cuda_runtime: ${{ matrix.include_cuda_runtime }}

      - name: Report wheel sizes
        shell: bash
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path

          lines = ["| Package | Wheel | Bytes | MiB |", "|---|---|---:|---:|"]
          for package, directory in [("Main", "wheelhouse"), ("LLVM targets", "wheelhouse-llvm-targets")]:
              for wheel in sorted(Path(directory).glob("*.whl")):
                  size = wheel.stat().st_size
                  lines.append(f"| {package} | {wheel.name} | {size:,} | {size / 2**20:.2f} |")
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PYTHON

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tirx-wheel-${{ matrix.artifact_suffix }}
          path: wheelhouse/*.whl
          if-no-files-found: error

      - name: Upload LLVM targets wheel artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tirx-llvm-targets-wheel-${{ matrix.artifact_suffix }}
          path: wheelhouse-llvm-targets/*.whl
          if-no-files-found: error

