name: Validate retained Windows ARM64 wheels
on:
  workflow_dispatch:
    inputs:
      orcjit_run:
        description: "Native ORCJIT artifact run"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: windows-11-arm
    env:
      TVM_WHEEL_EXPECT_LLVM: "1"
      TVM_WHEEL_EXPECT_CUDA_RUNTIME: "1"
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: 626693eeabff4b4fe4bd3efd9534de8c7b18418e
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          architecture: arm64
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tirx-wheel-windows-arm64
          path: artifacts/core
          run-id: 40257875533
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tirx-llvm-targets-wheel-windows-arm64
          path: artifacts/optional
          run-id: 40257875533
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cibw-orcjit-wheels-windows-11-arm-ARM64-0
          path: artifacts/orcjit
          repository: tqchen/tvm-ffi
          run-id: ${{ inputs.orcjit_run }}
          github-token: ${{ github.token }}
      - name: Apply Python loader correction to retained core wheel
        shell: bash
        run: |
          python -m pip install wheel
          python -m wheel unpack --dest artifacts/unpacked artifacts/core/*.whl
          python -c "from pathlib import Path; import shutil; root = next(Path('artifacts/unpacked').iterdir()); shutil.copyfile('python/tvm_tirx/base.py', root / 'tvm_tirx/base.py')"
          python -m wheel pack --dest-dir artifacts/patched_core artifacts/unpacked/*
      - name: Install core with native ORCJIT dependency
        id: install
        shell: bash
        run: |
          python -m pip install pytest numpy apache-tvm-ffi==0.1.15.post1 artifacts/orcjit/*.whl artifacts/patched_core/*.whl
          python -m pip check
          python -m pip freeze
      - name: Validate core wheel and CPU JIT
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -I -c "import importlib.util; assert importlib.util.find_spec('tvm') is None"
          python -I -m pytest -vvs "$GITHUB_WORKSPACE/tests/python/runtime/test_validate_wheel_library.py" "$GITHUB_WORKSPACE/tests/python/runtime/test_tensor.py" "$GITHUB_WORKSPACE/tests/python/ir/test_type.py" "$GITHUB_WORKSPACE/tests/python/sym/test_z3.py" "$GITHUB_WORKSPACE/tests/python/script/test_ir_builder.py" "$GITHUB_WORKSPACE/tests/python/codegen/llvm/test_basic.py::test_llvm_vadd_pipeline" "$GITHUB_WORKSPACE/tests/python/codegen/gpu_common/test_allreduce.py::test_allreduce_sum_compile" "$GITHUB_WORKSPACE/tests/python/tirx/codegen/test_cuda.py::test_typed_buffer_bindings" "$GITHUB_WORKSPACE/tests/python/tirx/codegen/test_cuda.py::test_vector_pointer_preserves_packed_offset"
      - name: Load CUDA sidecar without a GPU execution claim
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -I -c "import tvm_tirx; from tvm_ffi.libinfo import load_lib_ctypes; handle = load_lib_ctypes('tvm_tirx', 'tvm_runtime_cuda', 'RTLD_LOCAL', extra_lib_paths=tvm_tirx.libinfo.package_lib_paths()); print(handle._name)"
      - name: Install optional targets wheel and validate selection
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          python -m pip install artifacts/optional/*.whl
          python -m pip check
          wheel=$(cygpath -m "$(pwd)/$(echo artifacts/optional/*.whl)")
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/ci/wheel/check_llvm_targets_wheel.py" --wheel "$wheel"
          python -I -m pytest -vvs "$GITHUB_WORKSPACE/tests/python/codegen/llvm/test_basic.py::test_llvm_vadd_pipeline"
      - name: Report corrected wheel hash
        shell: bash
        run: python -c "from pathlib import Path; import hashlib; p = next(Path('artifacts/patched_core').glob('*.whl')); print(p.name, hashlib.sha256(p.read_bytes()).hexdigest())"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tirx-wheel-windows-arm64-validated
          path: artifacts/patched_core/*.whl
