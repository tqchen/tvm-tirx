name: Build speed diagnostics

on:
  push:
    branches: [windows-build-speed-909]
    paths:
      - .github/workflows/build-speed.yml
      - ci/diagnostics/build_speed.py
      - ci/diagnostics/test_build_speed.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    if: github.repository == 'tqchen/tvm-tirx' && github.ref == 'refs/heads/windows-build-speed-909'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-msbuild
            os: windows-latest
            generator: default
          - label: windows-ninja
            os: windows-latest
            generator: Ninja
          - label: macos-ninja
            os: macOS-latest
            generator: Ninja
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
          activate-environment: true
          enable-cache: false
      - name: Prepare build and test environment
        shell: bash
        run: |
          uv sync --no-default-groups --group build --group test --no-install-project --no-install-package apache-tvm-ffi
          uv pip install --no-deps ./3rdparty/tvm-ffi
      - name: Build with resource sampling
        shell: bash
        env:
          DIAGNOSTIC_LABEL: ${{ matrix.label }}
          DIAGNOSTIC_GENERATOR: ${{ matrix.generator }}
        run: python ci/diagnostics/build_speed.py
      - name: Install measured wheel
        shell: python
        run: |
          import glob, subprocess
          wheels = glob.glob('dist/apache_tvm_tirx-*.whl')
          assert len(wheels) == 1, wheels
          subprocess.run(['uv', 'pip', 'install', '--no-deps', '--force-reinstall', wheels[0]], check=True)
      - name: Python and example smoke tests
        shell: python
        run: |
          import os, subprocess
          subprocess.run([
              'uv', 'run', '--no-sync', 'python', '-m', 'pytest', '-v',
              'tests/python/codegen/llvm/test_minimal.py',
              'tests/python/runtime/test_validate_wheel_library.py', 'tests/python/script',
              'tests/python/ir/test_op_rust.py',
          ], check=True)
          command = (['cmd', '/c', 'call', r'tests\scripts\task_minimal_examples_cpu.bat']
                     if os.name == 'nt' else ['bash', 'tests/scripts/task_minimal_examples_cpu.sh'])
          subprocess.run(command, check=True)
      - name: Rust tests
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Preserve measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-speed-${{ matrix.label }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 30
